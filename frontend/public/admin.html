<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - GenestLoula</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#C4A18A',
                        'primary-hover': '#A8856F',
                        secondary: '#FCE4EC',
                        'bg-main': '#FAF9F6',
                        'text-primary': '#1A1A1A',
                        'text-secondary': '#5C5C5C',
                        'border-light': '#EAE5E0',
                    },
                    fontFamily: {
                        heading: ['Outfit', 'sans-serif'],
                        body: ['Manrope', 'sans-serif'],
                    },
                }
            }
        }
    </script>
    
    <style>
        body { font-family: 'Manrope', sans-serif; background-color: #FAF9F6; }
        h1, h2, h3, h4, h5, h6 { font-family: 'Outfit', sans-serif; }
        .tab-active { background-color: #C4A18A; color: white; }
        .tab-inactive { background-color: white; color: #1A1A1A; border: 1px solid #EAE5E0; }
        .tab-inactive:hover { background-color: #FCE4EC; }
        .modal-overlay { background: rgba(0,0,0,0.4); backdrop-filter: blur(4px); }
    </style>
</head>
<body>

    <!-- Header -->
    <header class="bg-white border-b border-border-light sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 sm:px-8 flex items-center justify-between h-16">
            <div class="flex items-center gap-4">
                <img src="https://customer-assets.emergentagent.com/job_422ceee8-c422-4d81-b1a3-9d924ef95c00/artifacts/0d6z2xph_logo%20%281%29.jpg" alt="Logo" class="h-10">
                <span class="font-heading text-xl text-text-primary font-medium">Administration</span>
            </div>
            <a href="/" class="text-sm text-primary hover:text-primary-hover font-medium transition-colors">Voir le site</a>
        </div>
    </header>

    <div class="max-w-7xl mx-auto px-4 sm:px-8 py-8">

        <!-- Stats Cards -->
        <div id="stats-grid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-6 gap-4 mb-10">
        </div>

        <!-- Tabs -->
        <div class="flex flex-wrap gap-2 mb-8">
            <button onclick="switchTab('products')" id="tab-products" class="px-5 py-2.5 rounded-full text-sm font-medium transition-all tab-active" data-testid="tab-products">Produits</button>
            <button onclick="switchTab('events')" id="tab-events" class="px-5 py-2.5 rounded-full text-sm font-medium transition-all tab-inactive" data-testid="tab-events">Événements</button>
            <button onclick="switchTab('testimonials')" id="tab-testimonials" class="px-5 py-2.5 rounded-full text-sm font-medium transition-all tab-inactive" data-testid="tab-testimonials">Témoignages</button>
            <button onclick="switchTab('newsletter')" id="tab-newsletter" class="px-5 py-2.5 rounded-full text-sm font-medium transition-all tab-inactive" data-testid="tab-newsletter">Newsletter</button>
            <button onclick="switchTab('carts')" id="tab-carts" class="px-5 py-2.5 rounded-full text-sm font-medium transition-all tab-inactive" data-testid="tab-carts">Paniers</button>
        </div>

        <!-- Tab Content -->
        <div id="tab-content"></div>
    </div>

    <!-- Modal -->
    <div id="modal" class="hidden fixed inset-0 z-50 modal-overlay flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-lg max-h-[90vh] overflow-y-auto">
            <div class="p-6 border-b border-border-light flex items-center justify-between">
                <h3 id="modal-title" class="text-xl font-medium font-heading text-text-primary"></h3>
                <button onclick="closeModal()" class="p-1 hover:bg-gray-100 rounded-lg">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>
            <div id="modal-body" class="p-6"></div>
        </div>
    </div>

    <!-- Toast -->
    <div id="toast" class="hidden fixed top-20 right-4 bg-white border-l-4 border-primary shadow-lg rounded-lg p-4 z-50">
        <p id="toast-message" class="text-text-primary font-medium"></p>
    </div>

    <script src="/js/admin.js"></script>
</body>
</html>
